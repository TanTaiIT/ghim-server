# Hạ tầng cho môi trường DEV. Production dùng managed service, không phải file này.
# Cổng 5435/5436 chứ không 5433/5434: booking đã giữ hai cổng đó, chạy hai dự án cùng máy không giẫm nhau.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ghim
      POSTGRES_PASSWORD: ghim
      # Hậu tố `_dev` bắt buộc (src/config/database-guard.ts). Chỉ có tác dụng khi volume còn trống.
      POSTGRES_DB: ghim_dev
    ports:
      - '5435:5432'
    volumes:
      # Từ image postgres:18, thư mục dữ liệu khuyến nghị là /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # App chờ DB SẴN SÀNG, không chỉ chờ container "đang chạy": Postgres mất vài giây khởi
      # tạo, và `prisma migrate` chạy trong khoảng đó sẽ hỏng vì connection refused.
      test: ['CMD-SHELL', 'pg_isready -U ghim -d ghim_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # DB cho `pnpm test` — container RIÊNG, không phải một DB nữa trong container dev: bộ test xoá
  # sạch bảng trước mỗi file, nên nó không được có đường nào chạm tới dữ liệu dev. `tmpfs` = dữ liệu
  # nằm trong RAM, tắt container là mất, và ghi nhanh hơn hẳn đĩa.
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: ghim
      POSTGRES_PASSWORD: ghim
      POSTGRES_DB: ghim_test
    ports:
      - '5436:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ghim -d ghim_test']
      interval: 2s
      timeout: 5s
      retries: 15

  # Hộp thư DEV cho mã xác nhận email (`pnpm mail:up`): nhận mọi thư gửi tới SMTP 1025 và hiện ở
  # http://localhost:8025, không thư nào ra ngoài — gõ email thật khi thử cũng không ai nhận được.
  # Production dùng SMTP của nhà cung cấp thật; code chỉ thấy một chuỗi kết nối SMTP nên không đổi.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      # Nhận mọi user/pass để chuỗi kết nối dev có cùng hình dạng (có xác thực) với production.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 5s
      retries: 15

  # Kho ảnh DEV, chuẩn S3 (`pnpm storage:up`). Production là Cloudflare R2; code chỉ thấy `STORAGE_URL` nên không đổi.
  # RustFS chứ không MinIO: MinIO đã gỡ image khỏi Docker Hub (kiểm 11/10/2026). Cổng 9100 / 9110 tránh 9000 hay bị
  # dự án khác giữ. Bucket do bước khởi động của `media` tạo khi còn thiếu.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ghim
      RUSTFS_SECRET_KEY: ghim-dev-secret
    ports:
      - '9100:9000'
      # Trang quản trị để xem ảnh đã tải: http://localhost:9101/rustfs/console/ — đăng nhập bằng cặp khoá ở trên.
      - '9101:9001'
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 2s
      timeout: 5s
      retries: 15

  # Kho cho `pnpm test`, tách khỏi kho dev như `postgres-test`; mỗi worker một bucket riêng, dữ liệu trong RAM.
  storage-test:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ghim
      RUSTFS_SECRET_KEY: ghim-test-secret
    ports:
      - '9110:9000'
    tmpfs:
      # RustFS chạy bằng uid 10001, không phải root.
      - /data:uid=10001,gid=10001
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
  storagedata:
