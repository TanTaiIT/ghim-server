name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Huỷ lượt chạy cũ khi có commit mới trên cùng nhánh — không để hàng đợi CI xếp sau những
# bản dựng đã lỗi thời.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client là code SINH RA, không commit — thiếu bước này thì typecheck đỏ vì
      # `@prisma/client` chưa có model nào.
      - run: pnpm exec prisma generate

      - run: pnpm run format:check
      # Spec và change phải đúng định dạng OpenSpec: một requirement thiếu scenario hay một delta
      # trỏ vào capability không tồn tại sẽ lặng lẽ biến mất lúc archive.
      - run: pnpm run spec:validate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

  # Mọi test chạy trên Postgres thật và kho ảnh thật, cùng việc kiểm migration SQL viết tay có khớp `schema.prisma`.
  # Postgres và RustFS là service của job — dùng một lần.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ghim
          POSTGRES_PASSWORD: ghim
          POSTGRES_DB: ghim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghim -d ghim_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: ghim
          RUSTFS_SECRET_KEY: ghim-test-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://ghim:ghim@localhost:5432/ghim_test
      DATABASE_URL: postgresql://ghim:ghim@localhost:5432/ghim_test
      TEST_STORAGE_URL: http://ghim:ghim-test-secret@localhost:9000/ghim-test
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      # globalSetup áp mọi migration (`migrate deploy`) lên DB trống, nhân bản cho từng worker rồi mới chạy test.
      - run: pnpm run test

      # Migration đã áp phải khớp đúng `schema.prisma`. Lệch = SQL viết tay sai tên index /
      # constraint, và `migrate dev` lần sau sẽ tự sinh lệnh DROP để "sửa".
      - run: pnpm run db:drift
