name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Huỷ lượt chạy cũ khi có commit mới trên cùng nhánh — không để hàng đợi CI xếp sau những
# bản dựng đã lỗi thời.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client là code SINH RA, không commit — thiếu bước này thì typecheck đỏ vì
      # `@prisma/client` chưa có model nào.
      - run: pnpm exec prisma generate

      - run: pnpm run format:check
      # Spec và change phải đúng định dạng OpenSpec: một requirement thiếu scenario hay một delta
      # trỏ vào capability không tồn tại sẽ lặng lẽ biến mất lúc archive.
      - run: pnpm run spec:validate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

  # Mọi test chạy trên Postgres thật và kho ảnh thật, cùng việc kiểm migration SQL viết tay có khớp `schema.prisma`.
  # Postgres và RustFS là service của job — dùng một lần.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ghim
          POSTGRES_PASSWORD: ghim
          POSTGRES_DB: ghim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghim -d ghim_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: ghim
          RUSTFS_SECRET_KEY: ghim-test-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://ghim:ghim@localhost:5432/ghim_test
      DATABASE_URL: postgresql://ghim:ghim@localhost:5432/ghim_test
      TEST_STORAGE_URL: http://ghim:ghim-test-secret@localhost:9000/ghim-test
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      # globalSetup áp mọi migration (`migrate deploy`) lên DB trống, nhân bản cho từng worker rồi mới chạy test.
      - run: pnpm run test

      # Migration đã áp phải khớp đúng `schema.prisma`. Lệch = SQL viết tay sai tên index /
      # constraint, và `migrate dev` lần sau sẽ tự sinh lệnh DROP để "sửa".
      - run: pnpm run db:drift

  # Image production dựng được, migrate được, khởi động được và tạo được master — đúng các lệnh Render chạy
  # (`render.yaml`). DB tên `ghim`: production từ chối tên kết thúc bằng `_dev` / `_test`.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ghim
          POSTGRES_PASSWORD: ghim
          POSTGRES_DB: ghim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghim -d ghim"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://ghim:ghim@localhost:5432/ghim
    steps:
      - uses: actions/checkout@v6

      - run: docker build -t ghim-server .

      # Pre-deploy command của Render, chạy bằng chính image.
      - run: docker run --rm --network host -e DATABASE_URL ghim-server node_modules/.bin/prisma migrate deploy

      # Bộ biến tối thiểu production đòi. Kho ảnh và SMTP không cần thật: lúc khởi động production không gọi tới.
      - name: Khởi động image
        run: |
          cat > prod.env <<EOF
          DATABASE_URL=$DATABASE_URL
          CORS_ORIGIN=https://ops.example.test
          TRUST_PROXY=uniquelocal
          JWT_SECRET=$(openssl rand -base64 48)
          IDENTITY_HASH_KEY=$(openssl rand -base64 48)
          SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32)
          SMTP_URL=smtp://ci:ci@localhost:1025
          MAIL_FROM=no-reply@example.test
          STORAGE_URL=https://ci:ci-secret@storage.example.test/ghim
          GOOGLE_CLIENT_IDS=ci.apps.googleusercontent.com
          EOF
          docker run -d --name ghim --network host --env-file prod.env ghim-server

      - name: Chờ /health/ready
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3100/health/ready && exit 0
            sleep 2
          done
          exit 1

      # Cách tạo master trên Render Shell: CLI đã biên dịch nằm sẵn trong image.
      - run: >-
          docker exec -e MASTER_PASSWORD=ci-Master-password-2026 ghim
          node dist/cli/create-master.js --email master@example.test --name "Quản trị CI"

      - if: always()
        run: docker logs ghim
